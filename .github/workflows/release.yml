name: Release TV App

# อัตโนมัติ: push tag แบบ v* (เช่น v1.1) -> build APK -> ปล่อย GitHub Release
# พร้อมอัปเดต app-update.json ใน main ให้แอปเช็คเวอร์ชันเจอ
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub ubuntu runners ship a preinstalled Android SDK at $ANDROID_HOME;
      # android-actions/setup-android v3 fails on the removed legacy "tools"
      # package, so just accept licenses here and let Gradle fetch any
      # missing platform/build-tools automatically.
      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Build debug APK (signed with committed debug.keystore)
        run: |
          chmod +x gradlew
          test -f .env || touch .env
          ./gradlew assembleDebug --no-daemon

      - name: Copy APK to stable filename
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk WOW-Drama-TV.apk

      - name: Extract version from build.gradle.kts
        id: ver
        run: |
          VC=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          VN=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "versionCode=$VC" >> "$GITHUB_OUTPUT"
          echo "versionName=$VN" >> "$GITHUB_OUTPUT"
          echo "versionCode=$VC, versionName=$VN"

      - name: Update app-update.json
        run: |
          TAG="${GITHUB_REF_NAME}"
          cat > app-update.json <<EOF
          {
            "versionCode": ${{ steps.ver.outputs.versionCode }},
            "versionName": "${{ steps.ver.outputs.versionName }}",
            "apkUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/WOW-Drama-TV.apk",
            "notes": "อัปเดตเวอร์ชัน ${{ steps.ver.outputs.versionName }}"
          }
          EOF
          cat app-update.json

      - name: Commit app-update.json to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-update.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update app-update.json for v${{ steps.ver.outputs.versionName }} [skip ci]"
            git push origin HEAD:main
          fi

      - name: Create GitHub Release with APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" WOW-Drama-TV.apk \
            --title "WOW Drama TV ${{ steps.ver.outputs.versionName }}" \
            --notes "ดาวน์โหลด WOW-Drama-TV.apk เพื่อติดตั้งเวอร์ชัน ${{ steps.ver.outputs.versionName }}" \
            --clobber || gh release upload "$TAG" WOW-Drama-TV.apk --clobber
